<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vertical frames</title>
</head>
    <!-- frames are used to divde the web browser window into multiple sections-->
    <frameset cols="25%, 50%, 25%">
        <frame name="left" src="https://www.google.com/"/>
        <frame name="center" src="/html/center.html"/>
        <frame name="right" src="/html/right.html"/>
    <noframes>
        <body>Text</body>
    </noframes>
    </frameset>

</html>
