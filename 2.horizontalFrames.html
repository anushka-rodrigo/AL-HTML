<!DOCTYPE html>
<html lang="en">
<head>
    <title>Horizontal frames</title>
</head>
    <!-- frames are used to divde the web browser window into multiple sections-->
    <frameset rows="10%, 80%, 10%">
        <frame name="top" src="https://www.sjp.ac.lk/"/>
        <frame name="main" src="/html/main.html"/>
        <frame name="bottom" src="/html/bottom.html"/>
    <noframes>
        <body>Text</body>
    </noframes>
    </frameset>

</html>
